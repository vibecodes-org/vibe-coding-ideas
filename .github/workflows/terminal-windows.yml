name: Terminal tests (Windows + macOS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terminal/**"
      - ".github/workflows/terminal-windows.yml"

permissions:
  contents: read

concurrency:
  group: terminal-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    name: terminal tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bridge and test packages (shared has no dependencies)
        run: |
          npm ci --prefix terminal/bridge
          npm ci --prefix terminal/test
      - name: Install helper packages (some tests look up electron; no app binary needed)
        run: npm ci --prefix terminal/helper
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Bridge tests
        run: npm test --prefix terminal/bridge
      - name: Shared tests
        if: always()
        run: npm test --prefix terminal/shared
      # The full integration suite drives POSIX shells (bash, sleep, sh scripts);
      # running it on Windows belongs to the Windows virtual machine stage.
      # Windows runs only the tests that do not need a POSIX shell.
      - name: Terminal integration tests (full, macOS)
        if: always() && runner.os == 'macOS'
        run: npm test --prefix terminal/test
      - name: Terminal tests that need no POSIX shell (Windows)
        if: always() && runner.os == 'Windows'
        working-directory: terminal/test
        run: node --test helper-launch-argv.test.mjs helper-stay-awake.test.mjs control-url.test.mjs agent-availability.test.mjs
