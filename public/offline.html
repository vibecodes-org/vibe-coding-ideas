<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - VibeCodes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fafafa;
      background-color: #09090b;
    }
    h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; }
    p { color: #a1a1aa; }
    .status { font-size: 0.8125rem; color: #71717a; min-height: 1.1em; }
    .actions { display: flex; gap: 0.75rem; align-items: center; }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    button {
      background-color: #fafafa;
      color: #09090b;
    }
    button:hover { background-color: #e4e4e7; }
    button:disabled { opacity: 0.6; cursor: default; }
    a {
      background-color: transparent;
      color: #fafafa;
      border: 1px solid #27272a;
    }
    a:hover { background-color: #18181b; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
       stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h.01" />
    <path d="M8.5 16.429a5 5 0 0 1 7 0" />
    <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
    <path d="M13.83 10.17A10 10 0 0 1 19 12.859" />
    <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
    <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
    <line x1="2" y1="2" x2="22" y2="22" />
  </svg>
  <div>
    <h1>You're offline</h1>
    <p>We'll keep trying and reload automatically as soon as you're back online.</p>
  </div>
  <div class="actions">
    <button id="retry-button" type="button">Try again</button>
    <a href="/dashboard">Go to Dashboard</a>
  </div>
  <div class="status" id="status-line">Checking connection&hellip;</div>

  <script>
    (function () {
      // Plain ES5-ish: this page must run entirely from the service worker cache, offline.
      var MIN_DELAY_MS = 4000;
      var MAX_DELAY_MS = 15000;

      var retryButton = document.getElementById("retry-button");
      var statusLine = document.getElementById("status-line");
      var pollTimer = null;
      var currentDelay = MIN_DELAY_MS;
      var probing = false;

      function nextDelay(delay) {
        // Gentle backoff so an idle offline tab doesn't hammer the network.
        var doubled = delay * 2;
        return doubled > MAX_DELAY_MS ? MAX_DELAY_MS : doubled;
      }

      function setStatus(text) {
        statusLine.textContent = text;
      }

      function probe(onProbeStart) {
        if (probing) return;
        probing = true;
        if (onProbeStart) onProbeStart();

        fetch("/api/health", { method: "GET", cache: "no-store" })
          .then(function () {
            // Any HTTP response at all means DNS + network are working again.
            setStatus("Back online, reloading…");
            location.reload();
          })
          .catch(function () {
            probing = false;
            setStatus("Still offline");
            scheduleNextPoll();
          });
      }

      function scheduleNextPoll() {
        if (pollTimer) clearTimeout(pollTimer);
        // Wait the current delay (4s first), then lengthen it for the next miss.
        pollTimer = setTimeout(function () {
          probe();
        }, currentDelay);
        currentDelay = nextDelay(currentDelay);
      }

      retryButton.addEventListener("click", function () {
        retryButton.disabled = true;
        retryButton.textContent = "Retrying…";
        probe(function () {
          setStatus("Checking connection…");
        });
        // Re-enable the button shortly in case the probe rejects.
        setTimeout(function () {
          retryButton.disabled = false;
          retryButton.textContent = "Try again";
        }, 3000);
      });

      window.addEventListener("online", function () {
        currentDelay = MIN_DELAY_MS;
        setStatus("Reconnecting…");
        probe();
      });

      // Kick off the first probe; scheduleNextPoll (called from the .catch
      // handler above) takes over polling from there.
      probe(function () {
        setStatus("Checking connection…");
      });
    })();
  </script>
</body>
</html>
